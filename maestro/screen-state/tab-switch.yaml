# ─────────────────────────────────────────────────────────────────────────────
# Bottom-nav tab-switch retains the Home dashboard scroll position
# ─────────────────────────────────────────────────────────────────────────────
#
# The bottom nav (Home / Profile) uses `saveState = true` / `restoreState = true`
# / `launchSingleTop = true` in the NavHost, so each tab's back-stack entry —
# including the Home dashboard's `rememberSaveable`-backed scroll position — is
# saved on switch and restored on return. Retention is entirely Navigation's own
# in-memory state-holder mechanism; feature modules carry zero retention code.
#
# Verified on physical device (OPPO CPH2423, Android 15) 2026-07-06.
appId: org.mifos.kmp.template.demo.debug
name: screen-state — bottom-nav tab switch retains Home scroll position
tags:
  - screen-state
  - home
  - retention
---
- launchApp:
    clearState: false
- assertVisible: "Outstanding balance"
# scroll the Home dashboard deep — the top content leaves the viewport
- scrollUntilVisible:
    element:
      text: "Country Macro"
    direction: DOWN
    timeout: 12000
- assertVisible: "Country Macro"
- assertNotVisible: "Outstanding balance"
# switch to the Profile tab (we leave Home)
- tapOn: "Profile"
- assertNotVisible: "Country Macro"
# ...and back to the Home tab (left half of the bottom nav)
- tapOn:
    point: 25%,94%
# RETENTION: Home lands where we left it, NOT reset to the top
- assertVisible: "Country Macro"
- assertNotVisible: "Outstanding balance"
