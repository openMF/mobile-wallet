name: Sync CMP Directories
on:
  workflow_dispatch:
    inputs:
      upstream:
        description: 'Upstream repository to sync directories from'
        default: 'https://github.com/openMF/kmp-project-template.git'
        required: true
        type: string
  schedule:
    - cron: '0 0 * * 1'

jobs:
  sync-directories:
    if: github.repository != 'openMF/kmp-project-template'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Setup Git config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          set -euo pipefail
          UPSTREAM="${{ inputs.upstream || 'https://github.com/openMF/kmp-project-template.git' }}"
          git remote add upstream "$UPSTREAM" || true
          git fetch upstream || exit 1

      - name: Check upstream/dev exists
        run: |
          set -euo pipefail
          if ! git rev-parse --verify upstream/dev >/dev/null 2>&1; then
            echo "Error: upstream/dev branch does not exist"
            exit 1
          fi

      - name: Create and checkout temporary branch
        run: |
          set -euo pipefail
          TEMP_BRANCH="temp-sync-branch-${{ github.run_number }}"
          git checkout -b "$TEMP_BRANCH" upstream/dev || exit 1
          echo "TEMP_BRANCH=$TEMP_BRANCH" >> $GITHUB_ENV

      - name: Sync directories and files
        shell: bash
        run: |
          set -euo pipefail

          # Declare directories and files to sync
          DIRS=(
            "cmp-android"
            "cmp-desktop"
            "cmp-ios"
            "cmp-web"
            "cmp-shared"
            "core-base"
            "build-logic"
            "fastlane"
            "fastlane-config"
            "scripts"
            "config"
            "secrets"
            ".github"
            ".run"
          )

          FILES=(
            "Gemfile"
            "Gemfile.lock"
            "ci-prepush.bat"
            "ci-prepush.sh"
          )

          # Define exclusions
          # Consumer-branded assets and project-specific configs are preserved across syncs.
          declare -A EXCLUSIONS=(
            ["cmp-android"]="src/main/res dependencies src/main/ic_launcher-playstore.png google-services.json"
            ["cmp-ios"]="iosApp/Assets.xcassets Configuration/Config.xcconfig"
            ["cmp-web"]="src/jsMain/resources src/wasmJsMain/resources"
            ["cmp-desktop"]="icons build.gradle.kts"
            ["fastlane-config"]="project_config.rb extract_config.rb"
            [".github"]="workflows/sync-dirs.yaml"
            ["build-logic"]="convention/src/main/kotlin/local"
            # Secrets: sync the SCAFFOLD only (secrets/sample/** + LAYOUT.yaml) so
            # forks inherit the canonical layout, but NEVER real values —
            # secrets/live/ is gitignored + fork-local (real secrets), and
            # .sync-meta.json is per-fork sync state. Matches scripts/white-label/sync-dirs.sh.
            # (secrets.env removed — that file was retired 2026-06-23.)
            ["secrets"]="live .sync-meta.json"
          )

          # Function to check if path should be excluded
          should_exclude() {
            local dir=$1
            local path=$2

            # Check for root exclusions (when dir is "." or "root")
            if [[ "$dir" == "." || "$dir" == "root" ]] && [[ -v "EXCLUSIONS[root]" ]]; then
              local root_excluded_paths
              IFS=' ' read -ra root_excluded_paths <<< "${EXCLUSIONS[root]}"
              for excluded in "${root_excluded_paths[@]}"; do
                if [[ "$path" == *"$excluded"* ]]; then
                  return 0
                fi
              done
            fi

            # Check directory-specific exclusions
            if [[ -v "EXCLUSIONS[$dir]" ]]; then
              local excluded_paths
              IFS=' ' read -ra excluded_paths <<< "${EXCLUSIONS[$dir]}"
              for excluded in "${excluded_paths[@]}"; do
                if [[ "$path" == *"$excluded"* ]]; then
                  return 0
                fi
              done
            fi
            return 1
          }

          # Function to preserve excluded paths
          preserve_excluded() {
            local dir=$1
            if [[ -v "EXCLUSIONS[$dir]" ]]; then
              local excluded_paths
              IFS=' ' read -ra excluded_paths <<< "${EXCLUSIONS[$dir]}"
              for excluded in "${excluded_paths[@]}"; do
                local full_path="$dir/$excluded"
                if [[ -e "$full_path" ]]; then
                  echo "Preserving excluded path: $full_path"
                  local temp_path="temp_excluded/$full_path"
                  mkdir -p "$(dirname "$temp_path")"
                  cp -r "$full_path" "$(dirname "$temp_path")/"
                fi
              done
            fi
          }

          # Function to restore excluded paths
          restore_excluded() {
            local dir=$1
            if [[ -v "EXCLUSIONS[$dir]" ]]; then
              local excluded_paths
              IFS=' ' read -ra excluded_paths <<< "${EXCLUSIONS[$dir]}"
              for excluded in "${excluded_paths[@]}"; do
                local full_path="$dir/$excluded"
                local temp_path="temp_excluded/$full_path"
                if [[ -e "$temp_path" ]]; then
                  echo "Restoring excluded path: $full_path"
                  mkdir -p "$(dirname "$full_path")"
                  rm -rf "$full_path"
                  cp -r "$temp_path" "$(dirname "$full_path")/"
                fi
              done
            fi
          }

          # Function to preserve root-level excluded files
          preserve_root_files() {
            if [[ -v "EXCLUSIONS[root]" ]]; then
              local excluded_paths
              IFS=' ' read -ra excluded_paths <<< "${EXCLUSIONS[root]}"
              for excluded in "${excluded_paths[@]}"; do
                if [[ -e "$excluded" ]]; then
                  echo "Preserving root-level excluded file: $excluded"
                  mkdir -p "temp_excluded/root"
                  cp -r "$excluded" "temp_excluded/root/"
                fi
              done
            fi
          }

          # Function to restore root-level excluded files
          restore_root_files() {
            if [[ -v "EXCLUSIONS[root]" ]]; then
              local excluded_paths
              IFS=' ' read -ra excluded_paths <<< "${EXCLUSIONS[root]}"
              for excluded in "${excluded_paths[@]}"; do
                if [[ -e "temp_excluded/root/$excluded" ]]; then
                  echo "Restoring root-level excluded file: $excluded"
                  cp -r "temp_excluded/root/$excluded" "./"
                fi
              done
            fi
          }

          # Create temp directory for exclusions
          mkdir -p temp_excluded

          # Preserve root-level exclusions before sync
          preserve_root_files

          # Switch to dev branch
          git checkout dev

          # Sync directories
          for dir in "${DIRS[@]}"; do
            if [[ ! -d "$dir" ]]; then
              echo "Creating $dir..."
              mkdir -p "$dir"
            fi

            # Preserve excluded paths before sync
            if [[ -d "$dir" ]]; then
              preserve_excluded "$dir"
            fi

            echo "Syncing $dir..."
            if ! git checkout "${{ env.TEMP_BRANCH }}" -- "$dir" 2>/dev/null; then
              echo "Warning: Could not sync directory $dir (may not exist in upstream)"
            fi

            # Restore excluded paths after sync
            restore_excluded "$dir"
          done

          # Sync files
          for file in "${FILES[@]}"; do
            file_dir=$(dirname "$file")
            file_name=$(basename "$file")

            # Check root exclusions for root-level files
            if [[ "$file_dir" == "." ]]; then
              if should_exclude "root" "$file_name"; then
                echo "Skipping excluded file: $file"
                continue
              fi
            elif should_exclude "$file_dir" "$file"; then
              echo "Skipping excluded file: $file"
              continue
            fi

            echo "Syncing $file..."
            if ! git checkout "${{ env.TEMP_BRANCH }}" -- "$file" 2>/dev/null; then
              echo "Warning: Could not sync file $file (may not exist in upstream)"
            fi
          done

          # Restore root-level excluded files
          restore_root_files

          # Cleanup temp directory
          rm -rf temp_excluded

          echo "Sync completed successfully!"

      - name: Heal libs.versions.toml — pull missing build-logic aliases from upstream
        shell: bash
        run: |
          set -uo pipefail
          # Self-healing step: `build-logic/` is sync'd from upstream, but
          # `gradle/libs.versions.toml` is intentionally consumer-local (it carries
          # project-specific package names + version overrides). When upstream adds
          # new `libs.<X>` accessors in build-logic with their matching catalog
          # entries, only the build-logic gets sync'd — the consumer's catalog falls
          # behind and the synced build-logic references aliases that don't exist
          # locally. This step detects that gap and pulls the missing alias entries
          # (and their referenced version keys) directly from the upstream catalog.

          LIBS_TOML="gradle/libs.versions.toml"
          TEMP_BRANCH="${{ env.TEMP_BRANCH }}"

          if [[ ! -f "$LIBS_TOML" ]]; then
            echo "ℹ️  Consumer has no $LIBS_TOML — nothing to heal."
            exit 0
          fi
          if [[ ! -d "build-logic" ]]; then
            echo "ℹ️  Consumer has no build-logic/ — nothing to heal."
            exit 0
          fi

          # Extract every libs.<ref> usage in build-logic Kotlin + KTS source.
          raw_refs=$(grep -rhoE '\blibs\.[a-zA-Z][a-zA-Z0-9._]*' \
                  --include='*.kt' --include='*.kts' \
                  build-logic 2>/dev/null \
              | sed -E 's/^libs\.//' \
              | sort -u)

          # Method-call accessors are not alias references — they take string args.
          method_re='^(findLibrary|findVersion|findBundle|findPlugin)([(.]|$)'

          # Cache upstream's catalog content once (avoid re-shelling git show per ref).
          upstream_toml=$(git show "${TEMP_BRANCH}:${LIBS_TOML}" 2>/dev/null || true)
          if [[ -z "$upstream_toml" ]]; then
            echo "⚠️  Upstream has no ${LIBS_TOML} — skipping heal."
            exit 0
          fi

          # Helper: insert a line at the start of [section] in the consumer's catalog.
          insert_into_section() {
            local section_name="$1"
            local line="$2"
            local line_no
            line_no=$(grep -n "^\[${section_name}\]" "$LIBS_TOML" | head -1 | cut -d: -f1)
            if [[ -z "$line_no" ]]; then
              echo "  ⚠️  No [$section_name] section header in $LIBS_TOML — skipping '$line'"
              return 1
            fi
            { head -n "$line_no" "$LIBS_TOML"; echo "$line"; tail -n +$((line_no + 1)) "$LIBS_TOML"; } > "${LIBS_TOML}.tmp"
            mv "${LIBS_TOML}.tmp" "$LIBS_TOML"
          }

          healed=0
          warnings=0
          while IFS= read -r ref; do
            [[ -z "$ref" ]] && continue
            [[ "$ref" =~ $method_re ]] && continue

            # Resolve target section + alias key per Gradle accessor convention.
            section="libraries"
            lookup="$ref"
            case "$ref" in
              plugins.*)
                section="plugins"
                lookup="${ref#plugins.}"
                ;;
              versions.*)
                section="versions"
                lookup="${ref#versions.}"
                # Whitelist the catalog filename — `libs.versions.toml` is a string in source.
                [[ "$lookup" == "toml" ]] && continue
                ;;
            esac
            key=$(echo "$lookup" | sed 's/\./-/g')

            # Already declared in the consumer's catalog? Skip.
            if grep -qE "^${key}[[:space:]]*=" "$LIBS_TOML"; then
              continue
            fi

            # Pull the matching entry from upstream.
            upstream_line=$(echo "$upstream_toml" | grep -E "^${key}[[:space:]]*=" | head -1)
            if [[ -z "$upstream_line" ]]; then
              echo "  ⚠️  Missing alias '$key' (for libs.$ref) not present in upstream catalog either — manual fix needed."
              warnings=$((warnings + 1))
              continue
            fi

            # If the alias references a version.ref, ensure that version key is also present.
            ref_version=$(echo "$upstream_line" | grep -oE 'version\.ref = "[^"]+"' | sed -E 's/version\.ref = "([^"]+)"/\1/' | head -1)
            if [[ -n "$ref_version" ]] && ! grep -qE "^${ref_version}[[:space:]]*=" "$LIBS_TOML"; then
              ver_line=$(echo "$upstream_toml" | grep -E "^${ref_version}[[:space:]]*=" | head -1)
              if [[ -n "$ver_line" ]]; then
                if insert_into_section "versions" "$ver_line"; then
                  echo "  ✅ Added version '$ref_version' (referenced by '$key') to [versions]"
                  healed=$((healed + 1))
                fi
              fi
            fi

            # Insert the alias entry itself.
            if insert_into_section "$section" "$upstream_line"; then
              echo "  ✅ Added '$key' to [$section] from upstream"
              healed=$((healed + 1))
            fi
          done <<< "$raw_refs"

          echo
          if [[ $healed -gt 0 ]]; then
            echo "🩹 Healed $healed entries in $LIBS_TOML — they will be included in the sync PR."
          elif [[ $warnings -gt 0 ]]; then
            echo "⚠️  $warnings missing aliases could not be auto-healed (not in upstream either). Manual fix needed."
            exit 1
          else
            echo "✅ libs.versions.toml already in sync with build-logic — no heal needed."
          fi

      - name: Clean up temporary branch
        if: always()
        run: git branch -D "${{ env.TEMP_BRANCH }}" 2>/dev/null || true

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git status --short
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "chore: Sync directories and files from upstream"
          title: "chore: Sync directories and files from upstream"
          body: |
            Automated sync of directories and files from upstream repository.

            Changes included in this sync:

            **Directories:**
            - cmp-android (excluding src/main/res, dependencies, src/main/ic_launcher-playstore.png, google-services.json)
            - cmp-desktop (excluding icons, build.gradle.kts)
            - cmp-ios (excluding iosApp/Assets.xcassets, Configuration/Config.xcconfig)
            - cmp-web (excluding src/jsMain/resources, src/wasmJsMain/resources)
            - cmp-shared
            - core-base
            - build-logic (excluding convention/src/main/kotlin/local — consumer flavor extension point)
            - fastlane
            - fastlane-config (excluding project_config.rb, extract_config.rb)
            - scripts
            - config
            - secrets (scaffold only — excludes secrets/live/ real values + .sync-meta.json)
            - .github (excluding workflows/sync-dirs.yaml — self-overwrite guard)
            - .run

            **Files:**
            - Gemfile
            - Gemfile.lock
            - ci-prepush.bat
            - ci-prepush.sh

            **Secrets:** scaffold only — secrets/sample/ + secrets/LAYOUT.yaml sync;
            secrets/live/ (real values) and .sync-meta.json are never synced.

            ---
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: sync-dirs-${{ github.run_number }}
          delete-branch: true
          labels: |
            sync
            automated pr
          base: dev
