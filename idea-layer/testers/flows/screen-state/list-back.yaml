# ─────────────────────────────────────────────────────────────────────────────
# AC-14 Scenario 1 — Personal Loans list → detail → Back → cached list, no reload
# ─────────────────────────────────────────────────────────────────────────────
#
# Walks the primary retained-state sample: the loans list is scrolled deep,
# a row is tapped to navigate to detail, Back is pressed, and the list is
# asserted to still be scrolled to the same row (no re-load spinner, no reset
# to top). Proves that `rememberRetainedScreenState("loans_list")` composes
# with the phase-03 `retainedKoinViewModel()` nav-back-stack scoping to
# survive the pop.
#
# testTag string constants sourced from the shipped
# `feature/loans/src/commonMain/kotlin/kpt/feature/loans/ui/TestTags.kt`
# (CU-5 append-only). Any rename lands here in the same commit.
#
# Executed on device via /idea-testers-run (pins captures to idea-layer/testers/captures/{run-id})
# — flow SoT lives at idea-layer/testers/flows/screen-state/list-back.yaml (RULE-TEST-OUTPUT-LAYOUT-001).
appId: org.mifos.kmp.template
name: screen-state — list ↔ detail ↔ back retention
tags:
  - screen-state
  - loans
  - retention
---
- launchApp:
    clearState: false
- tapOn: "Personal Loans"
- assertVisible:
    id: "loans_list"
- scrollUntilVisible:
    element:
      id: "loans_list_row_loan-15"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "loans_list_row_loan-15"
- assertVisible: "Back"
- back
- assertVisible:
    id: "loans_list_row_loan-15"  # scroll retained across nav pop (no reset-to-top)
