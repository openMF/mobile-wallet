# ─────────────────────────────────────────────────────────────────────────────
# AC-17 — CoinMarkets deep-scroll paging cursor restore over process death
# ─────────────────────────────────────────────────────────────────────────────
#
# The CoinMarkets screen is the paging-cursor sample delivered by phase 04.
# On re-entry after `killApp`, three separate axes of state must be restored
# in the correct order:
#
#   1. `PagingScreenStream` reads the persisted `{lastPageLoaded, query}`
#      cursor via `initialCursorProvider` and batch-re-pages `0..lastPageLoaded`
#      from durable Room rows (zero network hit).
#   2. `rememberRetainedScreenState("crypto_coinmarkets")` restores the
#      `LazyListState` to the saved `(firstVisibleItemIndex,
#      firstVisibleItemScrollOffset)` via `LaunchedEffect` on first
#      composition of the routeKey (see `RetainedScreenState.kt:60-70`).
#   3. The Screen's `LaunchedEffect(listState, viewModel)` re-arms the
#      scroll-position forwarding so subsequent deltas keep the datastore
#      cursor fresh.
#
# testTags sourced from `feature/crypto/.../ui/TestTags.kt` (flat `LIST` /
# `ROW` for Phase-04 back-compat).
appId: org.mifos.kmp.template
name: screen-state — CoinMarkets deep-scroll + cursor survives killApp
tags:
  - screen-state
  - crypto
  - retention
  - paging
  - process-death
---
- launchApp:
    clearState: false
- tapOn: "Crypto Markets"
- assertVisible:
    id: "coinMarkets.list"
- scroll
- scroll
- scroll  # trigger load-more once
- scroll
- scroll  # trigger load-more twice
- assertVisible:
    id: "coinMarkets.row"
- killApp  # full process death
- launchApp:
    clearState: false
- tapOn: "Crypto Markets"
- assertVisible:
    id: "coinMarkets.list"
- assertVisible:
    id: "coinMarkets.row"  # rows visible immediately — cursor restore hit Room, not the network
