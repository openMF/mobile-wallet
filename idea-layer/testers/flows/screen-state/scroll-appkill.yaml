# ─────────────────────────────────────────────────────────────────────────────
# AC-15 Scenario 2 — Personal Loans list scroll survives full process death
# ─────────────────────────────────────────────────────────────────────────────
#
# Full process-death gate. Backgrounding + swipe-away is not enough — Maestro's
# `killApp` is the only step that terminates the app process for real; the
# saved-state bundle path (`rememberSaveable` alone) does NOT survive it. The
# settings-backed `ScreenUiStateStore` (Phase 02) is what carries the
# `scrollIndex` / `scrollOffset` across the kill, and the `LaunchedEffect` in
# `rememberRetainedScreenState` restores position on first composition after
# relaunch.
#
# If the assertion after `launchApp` fails, either (a) the phase-02
# ScreenUiStateStore did not persist through the kill (writer debounce swallowed
# the last delta, or MapSettings backing was used in prod) or (b) the store
# read completed AFTER the initial LazyListState was already handed to the
# LazyColumn (restore-ordering bug — the read-before-collect serial ordering
# in `RetainedScreenState.kt` LaunchedEffect must hold).
appId: org.mifos.kmp.template
name: screen-state — scroll survives killApp + relaunch
tags:
  - screen-state
  - loans
  - retention
  - process-death
---
- launchApp:
    clearState: false
- tapOn: "Personal Loans"
- assertVisible:
    id: "loans_list"
- scrollUntilVisible:
    element:
      id: "loans_list_row_loan-25"
    direction: DOWN
    timeout: 10000
- killApp  # full process death — NOT backgrounding, NOT swipe-away
- launchApp:
    clearState: false
- tapOn: "Personal Loans"
- assertVisible:
    id: "loans_list_row_loan-25"  # scroll survived process death
