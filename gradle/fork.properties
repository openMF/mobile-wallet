store.primary.locale=en-US
store.title=Mifos Pay
store.subtitle=Open-source digital wallet
store.description=Mifos Pay is a simple, secure way to send, request, and track money. Create a wallet account, add a card, share a QR to get paid, set standing instructions for recurring transfers, and manage invoices—all from one clean, modern app. WHAT YOU CAN DO: Sign up as a customer or merchant and complete a guided registration; create a wallet savings account (subject to approval) and see your balance at a glance; send money using a Virtual Payment Address (VPA), mobile number, or account number; request money with your personal QR code, optionally setting the amount and currency before sharing; add and manage cards, viewing masked details and removing or editing when needed; track everything in Payments (filter History by debits or credits, view statements, see real-time notifications); set SI (Standing Instructions) for automatic transfers on a fixed schedule (weeks, months, years); create and review invoices, seeing invoice status, items, and transaction IDs; keep profile details up to date (name, address, phone, VPA) and link a bank account; upload documents for KYC or support directly in the app; get help fast with built-in FAQs.
store.promotional.text=Send and receive money, pay merchants, and track transactions with an open-source wallet powered by Mifos X / Fineract.
store.release.notes=
store.copyright=© 2025 The Mifos Initiative
