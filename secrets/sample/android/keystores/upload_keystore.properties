# CLAUDE-PLACEHOLDER — do not commit this to secrets/
# UPLOAD keystore = PLAY CONSOLE UPLOAD KEY (what your CI signs AABs with
# before uploading. Play Console verifies the upload signature, then re-signs
# with the ORIGINAL/app-signing key before distributing to users).
#
# Generate via:
#   ./keystore-manager.sh generate
# OR manually:
#   keytool -genkey -keystore secrets/android/keystores/upload_keystore.keystore \
#     -alias upload -keyalg RSA -keysize 4096 -validity 25000
#
# Rotatable if compromised (request key rotation in Play Console).
storeFile=upload_keystore.keystore
storePassword=PLACEHOLDER_UPLOAD_STORE_PASSWORD
keyAlias=upload
keyPassword=PLACEHOLDER_UPLOAD_KEY_PASSWORD
