# ═════════════════════════════════════════════════════════════════════════════
# secrets-needs-schema.yaml — DUAL-MODE per-target secrets contract
#
# Authority:  RULE-DEPLOYMENT-MANIFEST-001 (DM8)
# JSON Schema: core/schemas/secrets-needs.schema.json
#
# Every `deployment/<platform>/<target>/secrets-needs.yaml` MUST follow the
# shape documented here. The schema is dual-mode: each `needs[]` entry
# declares EITHER a `vault.alias` (canonical path) OR a `manual` block
# (placeholder file + GHA-secret variable name) — never both. Both modes
# materialize through the same `canonical: secrets/<path>` key, so downstream
# consumers (Fastlane / GHA workflows) read a single filesystem path
# regardless of how the secret arrived.
#
# This file is a HUMAN-readable schema cheat-sheet. The machine-validated
# schema lives at core/schemas/secrets-needs.schema.json.
# ═════════════════════════════════════════════════════════════════════════════

schema_version: "1.0"
dual_mode: true

# ── Example per-target secrets-needs.yaml shape (illustrative, NOT live) ────
example:
  schema_version: "1.0"
  dual_mode: true

  vault_aliases:
    # Canonical alias the vault resolver will look up
    - alias: kmp_template_release_keystore
      canonical: "secrets/live/android/keystores/upload_keystore.keystore"
      required_for: ["build", "sign"]
      materialize:
        format: "file"
        via: "copy"

  manual_inputs:
    # Used when the vault entry is absent — operator hand-drops a file at
    # `placeholder` and CI workflow projects `gha_secret_var` → same path.
    - canonical: "secrets/live/android/keystores/upload_keystore.keystore"
      source_hint: "Android Studio → Build → Generate Signed Bundle"
      placeholder: "secrets/sample/android/keystores/upload_keystore.keystore"
      gha_secret_var: "UPLOAD_KEYSTORE_B64"

# ── Field reference ─────────────────────────────────────────────────────────
field_reference:
  schema_version: "Required. Literal \"1.0\"."
  dual_mode: "Required. Literal `true`. Future schemas may set false to lock to vault-only."
  vault_aliases:
    type: "array of objects"
    item_required: ["alias", "canonical", "required_for"]
    item_optional: ["materialize", "rotation_policy"]
    semantics: "Resolved via SECRETS_ALIAS_REGISTRY.yaml + the vault REGISTRY.yaml chain."
  manual_inputs:
    type: "array of objects"
    item_required: ["canonical", "source_hint", "placeholder"]
    item_optional: ["gha_secret_var"]
    semantics: "Fallback when no vault row exists. `placeholder` MUST point under secrets/sample/."

# ── Validator hooks ─────────────────────────────────────────────────────────
validator_hooks:
  preflight: "deployment/_shared/scripts/manual-preflight.sh"
  bulk_check: "core/scripts/deployment-secrets-doc-gen.sh --check-placeholders-only"
  schema_validate: "core/scripts/deployment-manifest-validate.sh"
