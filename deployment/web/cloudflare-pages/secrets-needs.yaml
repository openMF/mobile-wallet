# deployment/web/cloudflare-pages/secrets-needs.yaml
schema_version: "1.0"
target: web-cloudflare-pages
dual_mode: true
required_for: [web-cloudflare-pages-publish]

vault_aliases:
  - alias: mifos-x-cloudflare-api-token
    canonical: env:CLOUDFLARE_PAGES_API_TOKEN
    required_for: ["wrangler-auth"]
    materialize: { format: "env", via: "export" }
  - alias: mifos-x-cloudflare-account-id
    canonical: env:CLOUDFLARE_ACCOUNT_ID
    required_for: ["wrangler-target"]
    materialize: { format: "env", via: "export" }

manual_inputs:
  - canonical: env:CLOUDFLARE_PAGES_API_TOKEN
    source_hint: "Cloudflare → My Profile → API Tokens → Create token with Pages:Edit"
    placeholder: "<cloudflare-api-token>"
    gha_secret_var: "CLOUDFLARE_PAGES_API_TOKEN"
  - canonical: env:CLOUDFLARE_ACCOUNT_ID
    source_hint: "Cloudflare → Account → Overview → Account ID"
    placeholder: "<cloudflare-account-id>"
    gha_secret_var: "CLOUDFLARE_ACCOUNT_ID"
