# deployment/web/netlify/secrets-needs.yaml
schema_version: "1.0"
target: web-netlify
dual_mode: true
required_for: [web-netlify-publish]

vault_aliases:
  - alias: netlify_auth_token
    canonical: env:NETLIFY_AUTH_TOKEN
    required_for: ["auth"]
    materialize: { format: "env", via: "export" }
  - alias: netlify_site_id
    canonical: env:NETLIFY_SITE_ID
    required_for: ["target-site"]
    materialize: { format: "env", via: "export" }

manual_inputs:
  - canonical: env:NETLIFY_AUTH_TOKEN
    source_hint: "Netlify → User settings → Applications → New personal access token"
    placeholder: "<netlify-pat>"
    gha_secret_var: "NETLIFY_AUTH_TOKEN"
  - canonical: env:NETLIFY_SITE_ID
    source_hint: "Netlify → Site settings → General → Site ID"
    placeholder: "<netlify-site-id>"
    gha_secret_var: "NETLIFY_SITE_ID"
