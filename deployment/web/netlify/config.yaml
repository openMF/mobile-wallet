# deployment/web/netlify/config.yaml
target: web-netlify
platform: web
host: netlify
tier: 2
owning_capability: web-netlify-publish
output_format: web
output_path: "cmp-web/build/dist/js/productionExecutable/"
version_format: "git"
signing: none
distribution_groups: ["public"]
retention: "indefinite"
runners:
  local: { command: "netlify deploy --prod --dir=cmp-web/build/dist/js/productionExecutable" }
  ci:    { workflow_snippet: workflow-snippet.yml }
requires_confirm: false
enabled_by_default: false
