# deployment/web/vercel/secrets-needs.yaml
schema_version: "1.0"
target: web-vercel
dual_mode: true
required_for: [web-vercel-publish]

vault_aliases:
  - alias: mifos-x-vercel-token
    canonical: env:VERCEL_TOKEN
    required_for: ["auth"]
    materialize: { format: "env", via: "export" }
  - alias: mifos-x-vercel-org-id
    canonical: env:VERCEL_ORG_ID
    required_for: ["target-org"]
    materialize: { format: "env", via: "export" }
  - alias: kmp-project-template-vercel-project-id
    canonical: env:VERCEL_PROJECT_ID
    required_for: ["target-project"]
    materialize: { format: "env", via: "export" }

manual_inputs:
  - canonical: env:VERCEL_TOKEN
    source_hint: "Vercel → Account → Settings → Tokens"
    placeholder: "<vercel-token>"
    gha_secret_var: "VERCEL_TOKEN"
  - canonical: env:VERCEL_ORG_ID
    source_hint: "Vercel → Team settings → General → Team ID"
    placeholder: "<vercel-org-id>"
    gha_secret_var: "VERCEL_ORG_ID"
  - canonical: env:VERCEL_PROJECT_ID
    source_hint: "Vercel → Project → Settings → Project ID"
    placeholder: "<vercel-project-id>"
    gha_secret_var: "VERCEL_PROJECT_ID"
