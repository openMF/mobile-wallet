# deployment/desktop/windows-exe/secrets-needs.yaml
schema_version: "1.0"
target: desktop-windows-exe
dual_mode: true
required_for: [github-releases-publish]

vault_aliases:
  - alias: github_release_upload_token
    canonical: env:GH_TOKEN
    required_for: ["upload"]
    materialize: { format: "env", via: "export" }

manual_inputs:
  - canonical: env:GH_TOKEN
    source_hint: "${{ secrets.GITHUB_TOKEN }} suffices for the active repo"
    placeholder: "<gh-pat-or-actions-token>"
    gha_secret_var: "GITHUB_TOKEN"
