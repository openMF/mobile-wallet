# deployment/desktop/msi-signed/secrets-needs.yaml
# Tier-2 — Azure Trusted Signing via OIDC. No long-lived secrets.
#
# TODO(secrets-bootstrap): all azure_ts_* aliases are declared but the rows
# are pending in SECRETS_ALIAS_REGISTRY.yaml. Add via /secrets request when
# Azure Trusted Signing is bootstrapped for the org. Until then, this target
# is enabled_by_default: false and CI requires explicit dispatch with secrets
# wired manually as repo secrets.
schema_version: "1.0"
target: desktop-msi-signed
dual_mode: true
required_for: [desktop-azure-trusted-signing]

vault_aliases:
  - alias: azure_ts_tenant_id
    canonical: env:AZURE_TS_TENANT_ID
    required_for: ["oidc"]
    materialize: { format: "env", via: "export" }
  - alias: azure_ts_client_id
    canonical: env:AZURE_TS_CLIENT_ID
    required_for: ["oidc"]
    materialize: { format: "env", via: "export" }
  - alias: azure_ts_subscription_id
    canonical: env:AZURE_TS_SUBSCRIPTION_ID
    required_for: ["oidc"]
    materialize: { format: "env", via: "export" }
  - alias: azure_ts_account_name
    canonical: env:AZURE_TS_ACCOUNT_NAME
    required_for: ["sign"]
    materialize: { format: "env", via: "export" }
  - alias: azure_ts_cert_profile_name
    canonical: env:AZURE_TS_CERT_PROFILE_NAME
    required_for: ["sign"]
    materialize: { format: "env", via: "export" }

manual_inputs:
  - canonical: env:AZURE_TS_TENANT_ID
    source_hint: "Azure → Entra ID → Overview → Tenant ID"
    placeholder: "<azure-tenant-uuid>"
    gha_secret_var: "AZURE_TS_TENANT_ID"
  - canonical: env:AZURE_TS_CLIENT_ID
    source_hint: "Azure → App registration for GH OIDC federation"
    placeholder: "<azure-client-uuid>"
    gha_secret_var: "AZURE_TS_CLIENT_ID"
  - canonical: env:AZURE_TS_SUBSCRIPTION_ID
    source_hint: "Azure → Subscriptions → Subscription ID"
    placeholder: "<azure-subscription-uuid>"
    gha_secret_var: "AZURE_TS_SUBSCRIPTION_ID"
  - canonical: env:AZURE_TS_ACCOUNT_NAME
    source_hint: "Azure → Trusted Signing → Signing account name"
    placeholder: "<account-name>"
    gha_secret_var: "AZURE_TS_ACCOUNT_NAME"
  - canonical: env:AZURE_TS_CERT_PROFILE_NAME
    source_hint: "Azure → Trusted Signing → Certificate profile name"
    placeholder: "<cert-profile-name>"
    gha_secret_var: "AZURE_TS_CERT_PROFILE_NAME"
