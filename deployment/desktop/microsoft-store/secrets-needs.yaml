# deployment/desktop/microsoft-store/secrets-needs.yaml
# Tier-2 — Microsoft Partner Center submission (MSIX → Store; the Store re-signs).
#
# 2026-06-24: all 7 vault rows now exist in SECRETS_ALIAS_REGISTRY.yaml (group
# kmp-project-template). The 6 non-secret identifiers (Store ID, AAD tenant/client
# GUIDs, MSIX identity name/publisher/display) + the 1 real secret (client secret)
# all live in the vault as the single SoT and materialize to ENV. No Azure
# subscription / code-signing cert needed — the Store signs the MSIX.
schema_version: "1.0"
target: desktop-microsoft-store
dual_mode: true
required_for: [desktop-microsoft-store]

vault_aliases:
  - alias: mifos-x-ms-partner-center-tenant-id
    canonical: env:MS_PARTNER_CENTER_TENANT_ID
    required_for: ["service-principal-auth"]
    materialize: { format: "env", via: "export" }
  - alias: mifos-x-ms-partner-center-client-id
    canonical: env:MS_PARTNER_CENTER_CLIENT_ID
    required_for: ["service-principal-auth"]
    materialize: { format: "env", via: "export" }
  - alias: mifos-x-ms-partner-center-client-secret
    canonical: env:MS_PARTNER_CENTER_CLIENT_SECRET
    required_for: ["service-principal-auth"]
    materialize: { format: "env", via: "export" }
  - alias: mifos-x-msstore-app-id
    canonical: env:MS_APP_ID
    required_for: ["submission"]
    materialize: { format: "env", via: "export" }
  - alias: mifos-x-msstore-identity-name
    canonical: env:WINDOWS_MSIX_IDENTITY_NAME
    required_for: ["msix-build"]
    materialize: { format: "env", via: "export" }
  - alias: mifos-x-msstore-publisher
    canonical: env:WINDOWS_MSIX_PUBLISHER
    required_for: ["msix-build"]
    materialize: { format: "env", via: "export" }
  - alias: mifos-x-msstore-publisher-display-name
    canonical: env:WINDOWS_MSIX_PUBLISHER_DISPLAY_NAME
    required_for: ["msix-build"]
    materialize: { format: "env", via: "export" }

manual_inputs:
  - canonical: env:MS_PARTNER_CENTER_TENANT_ID
    source_hint: "Azure → Entra ID → Tenant ID (same as Azure tenant)"
    placeholder: "<azure-tenant-uuid>"
    gha_secret_var: "MS_PARTNER_CENTER_TENANT_ID"
  - canonical: env:MS_PARTNER_CENTER_CLIENT_ID
    source_hint: "Azure → App registration for Partner Center"
    placeholder: "<client-uuid>"
    gha_secret_var: "MS_PARTNER_CENTER_CLIENT_ID"
  - canonical: env:MS_PARTNER_CENTER_CLIENT_SECRET
    source_hint: "Azure → App registration → Certificates & secrets → Client secret"
    placeholder: "<client-secret>"
    gha_secret_var: "MS_PARTNER_CENTER_CLIENT_SECRET"
  - canonical: env:MS_APP_ID
    source_hint: "Partner Center → Your app → Product management → Product identity → Store ID"
    placeholder: "<store-app-id>"
    gha_secret_var: "MS_APP_ID"
  - canonical: env:WINDOWS_MSIX_IDENTITY_NAME
    source_hint: "Partner Center → Your app → Product management → Product identity → Package/Identity/Name"
    placeholder: "<publisher.appname>"
    gha_secret_var: "WINDOWS_MSIX_IDENTITY_NAME"
  - canonical: env:WINDOWS_MSIX_PUBLISHER
    source_hint: "Partner Center → Your app → Product management → Product identity → Package/Identity/Publisher"
    placeholder: "CN=<publisher-id>"
    gha_secret_var: "WINDOWS_MSIX_PUBLISHER"
  - canonical: env:WINDOWS_MSIX_PUBLISHER_DISPLAY_NAME
    source_hint: "Partner Center → Your app → Product management → Product identity → Package/Properties/PublisherDisplayName"
    placeholder: "<publisher-display-name>"
    gha_secret_var: "WINDOWS_MSIX_PUBLISHER_DISPLAY_NAME"
