# deployment/desktop/linux-deb/secrets-needs.yaml
schema_version: "1.0"
target: desktop-linux-deb
dual_mode: true
required_for: [github-releases-publish]

vault_aliases:
  - alias: github_release_upload_token
    canonical: env:GH_TOKEN
    required_for: ["upload"]
    materialize: { format: "env", via: "export" }

manual_inputs:
  - canonical: env:GH_TOKEN
    source_hint: "GitHub Actions provides ${{ secrets.GITHUB_TOKEN }} for repo-scoped uploads"
    placeholder: "<gh-pat-or-actions-token>"
    gha_secret_var: "GITHUB_TOKEN"
