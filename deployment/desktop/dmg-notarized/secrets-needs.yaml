# deployment/desktop/dmg-notarized/secrets-needs.yaml
# Tier-2 — opt-in. Match-managed Developer ID Application cert.
#
# The Developer ID cert lifecycle is owned by Fastlane Match (`type: developer_id`,
# `platform: macos`). The cert + private key live in the org's Match git repo,
# encrypted with MATCH_PASSWORD. Match installs them into the keychain at lane
# runtime — no manual .p12 import, no DEVELOPER_ID_CERT_B64 GitHub secret.
#
# Pre-flight (one-time, maintainer-only):
#   bundle exec fastlane match developer_id --platform macos
# This seeds the Match repo with a Developer ID Application cert. Every CI run
# after that is `readonly: true` and just consumes.
#
# Secrets here are the union of (a) Match-repo access and (b) ASC API key, which
# Match needs for cert issuance + the notarize action needs for notarytool.
schema_version: "1.0"
target: desktop-dmg-notarized
dual_mode: true
required_for: [macos-signing, desktop-dmg-notarized]

vault_aliases:
  # ── App Store Connect API key (shared with iOS appstore + mac-app-store) ──
  - alias: mifos-x-appstore-auth-key-p8
    canonical: "secrets/live/apple/appstore/AuthKey.p8"
    required_for: ["match-cert-issuance", "notarytool"]
    materialize: { format: "file", via: "copy" }
  - alias: mifos-x-appstore-key-id
    canonical: "secrets/live/apple/appstore/key_id"
    required_for: ["match-cert-issuance", "notarytool"]
    materialize: { format: "file", via: "copy" }
  - alias: mifos-x-appstore-issuer-id
    canonical: "secrets/live/apple/appstore/issuer_id"
    required_for: ["match-cert-issuance", "notarytool"]
    materialize: { format: "file", via: "copy" }

  # ── Match repo access (shared with iOS + mac-app-store) ─────────────────────
  - alias: mifos-x-match-cert-bundle
    canonical: "secrets/live/apple/match/match_ci_key"
    required_for: ["match-clone"]
    materialize: { format: "file", via: "copy" }
  - alias: mifos-x-match-password
    canonical: "secrets/live/apple/match/.match_password"
    required_for: ["match-decrypt"]
    materialize: { format: "file", via: "copy" }

manual_inputs:
  - canonical: "secrets/live/apple/appstore/AuthKey.p8"
    source_hint: "App Store Connect → Users and Access → Keys (Admin or App Manager role)"
    placeholder: "<base64-p8>"
    gha_secret_var: "APPSTORE_AUTH_KEY_B64"
  - canonical: "secrets/live/apple/appstore/key_id"
    source_hint: "App Store Connect key id (10-char alphanumeric)"
    placeholder: "<key-id>"
    gha_secret_var: "APPSTORE_KEY_ID"
  - canonical: "secrets/live/apple/appstore/issuer_id"
    source_hint: "App Store Connect issuer id (UUID)"
    placeholder: "<issuer-id>"
    gha_secret_var: "APPSTORE_ISSUER_ID"
  - canonical: "secrets/live/apple/match/match_ci_key"
    source_hint: "Match repo SSH deploy key (private half). Generate with `ssh-keygen -t ed25519 -N ''`."
    placeholder: "<base64-ssh-private-key>"
    gha_secret_var: "MATCH_SSH_PRIVATE_KEY_B64"
  - canonical: "secrets/live/apple/match/.match_password"
    source_hint: "Match encryption password — used to encrypt certs at rest in the Match git repo"
    placeholder: "<password>"
    gha_secret_var: "MATCH_PASSWORD"
