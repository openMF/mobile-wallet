# deployment/android/play-production/secrets-needs.yaml
# Production-tier target — gated by requires_confirm + declares both capabilities (AC34/AC35).
schema_version: "1.0"
target: android-play-production
dual_mode: true
required_for: [android-signing, android-play-prod-publish]

vault_aliases:
  - alias: mifos-pay-upload-keystore
    canonical: "secrets/live/android/keystores/upload_keystore.keystore"
    required_for: ["sign-verification"]
    materialize: { format: "file", via: "copy" }
  - alias: mifos-pay-upload-keystore-storepass
    canonical: "secrets/live/android/keystores/upload_keystore.properties"
    required_for: ["sign-verification"]
    materialize: { format: "env", via: "export" }
  - alias: mifos-pay-upload-keystore-keyalias
    canonical: "secrets/live/android/keystores/upload_keystore.properties"
    required_for: ["sign-verification"]
    materialize: { format: "env", via: "export" }
  - alias: mifos-pay-upload-keystore-keypass
    canonical: "secrets/live/android/keystores/upload_keystore.properties"
    required_for: ["sign-verification"]
    materialize: { format: "env", via: "export" }
  - alias: mifos-x-playstore-service-account
    canonical: "secrets/live/android/play/playStorePublishServiceCredentialsFile.json"
    required_for: ["promote-to-prod"]
    materialize: { format: "file", via: "copy" }

manual_inputs:
  - canonical: "secrets/live/android/keystores/upload_keystore.keystore"
    source_hint: "Request from release-mgr"
    placeholder: "<base64-keystore>"
    gha_secret_var: "ANDROID_RELEASE_KEYSTORE_B64"
  - canonical: "secrets/live/android/play/playStorePublishServiceCredentialsFile.json"
    source_hint: "Play Console → API access → Service accounts → Download JSON key (PROD)"
    placeholder: "<service-account-json>"
    gha_secret_var: "PLAYSTORE_PUBLISHER_JSON"
