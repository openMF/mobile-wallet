# deployment/android/play-production/workflow-snippet.yml
# Reusable GHA snippet for Android → promote beta → production (no build).
# REQUIRES `requires_confirm: true` — gated by /release approval gate.
name: android-play-production-promote
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CONFIRM to proceed"
        required: true
        type: string

jobs:
  promote:
    if: ${{ inputs.confirm == 'CONFIRM' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with: { bundler-cache: true }

      # deployment/**/metadata is DERIVED from app-profile/ (gitignored), so this promotion job —
      # which does NOT build — must still materialize the listing before the drift-checked sync in the
      # lane can push it to production. Explicit JDK+Gradle + syncForkConfig (SYNC_FORK_DONE=1 makes
      # the Fastfile before_all skip its own run). Without this a promote could ship a stale listing.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: '17' }
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Materialize store listing from app-profile (syncForkConfig)
        run: |
          ./gradlew -q syncForkConfig
          echo "SYNC_FORK_DONE=1" >> "$GITHUB_ENV"

      - name: Materialize secrets (vault-mode)
        if: ${{ secrets.SOPS_AGE_KEY != '' }}
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: bash deployment/_shared/scripts/secrets-pull.sh --required-for android-play-prod-publish

      - name: Materialize secrets (manual-mode)
        if: ${{ secrets.SOPS_AGE_KEY == '' }}
        run: |
          mkdir -p secrets
          echo '${{ secrets.PLAYSTORE_PUBLISHER_JSON }}' > secrets/live/android/playStorePublishServiceCredentialsFile.json

      - name: Promote to production
        run: bundle exec fastlane android promote_to_production
