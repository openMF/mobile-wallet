# deployment/ios/firebase/workflow-snippet.yml
# Reusable GHA snippet for iOS → Firebase App Distribution.
name: ios-firebase-deploy
on:
  workflow_call:

jobs:
  deploy:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with: { bundler-cache: true }

      - name: Materialize secrets (vault-mode)
        if: ${{ secrets.SOPS_AGE_KEY != '' }}
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: bash deployment/_shared/scripts/secrets-pull.sh --required-for ios-signing,ios-firebase-distribute

      - name: Materialize secrets (manual-mode)
        if: ${{ secrets.SOPS_AGE_KEY == '' }}
        run: |
          mkdir -p secrets
          echo "${{ secrets.APPSTORE_AUTH_KEY_B64 }}" | base64 -d > secrets/live/apple/appstore/AuthKey.p8
          echo "${{ secrets.MATCH_CI_KEY }}" > secrets/live/apple/match/match_ci_key
          chmod 600 secrets/live/apple/match/match_ci_key
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > secrets/live/android/firebaseAppDistributionServiceCredentialsFile.json

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Deploy to Firebase (iOS)
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane ios deploy_on_firebase
